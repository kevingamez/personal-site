# pnpm settings live here as of pnpm 10.16+ (the "pnpm" key in package.json is ignored).
# https://pnpm.io/settings

# Pin the transitive `yaml` (pulled in by lighthouse/stylelint tooling).
overrides:
  yaml: ^2.8.4

# pnpm blocks dependency build scripts by default and, since 10.16, FAILS the
# install rather than warning when it skips one. esbuild (via tsx) needs its
# postinstall to fetch its native binary.
#
# The key is `allowBuilds`, not the `onlyBuiltDependencies` list that pnpm 10
# used: 11.x silently ignores the old name, which is why CI and Vercel both
# died with ERR_PNPM_IGNORED_BUILDS while local installs looked fine (their
# store already had the binary built). `pnpm approve-builds --all` writes this
# shape.
allowBuilds:
  esbuild: true
